# ============================================================================
#  Global Yarn (berry) config — symlinked to ~/.yarnrc.yml by install.sh
#  Project-level .yarnrc.yml always wins over this, so per-repo overrides
#  keep working. Yarn classic (1.x) ignores this file entirely.
# ============================================================================

# Use node_modules instead of PnP so tools "just work"
nodeLinker: node-modules

# In a monorepo, only hoist to the workspace root – avoids weird cross-pkg deps
nmHoistingLimits: workspaces

# Faster reinstalls, smaller repo: keep cache outside the project
enableGlobalCache: true

# Don't silently fix things; fail if lockfile / install state is out of sync
#enableImmutableInstalls: true

# Be strict about checksums – fail if tarballs don't match
checksumBehavior: throw

# Nice balance between speed & disk size
compressionLevel: mixed

# Disable telemetry for privacy / cleanliness
enableTelemetry: false

# Slightly nicer UX
preferInteractive: true
