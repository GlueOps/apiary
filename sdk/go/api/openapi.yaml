          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Revoke a fleet SSH key
      tags:
      - Fleet
