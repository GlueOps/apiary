                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Delete an auth access rule
      tags:
      - Platform
    put:
      description: "Policy and reason only. Kind, value and purpose are the rule's\
        \ identity — retargeting one is a delete and a create, so that both facts\
        \ stay visible. This is also the durable way to permit a seeded public domain:\
        \ an update survives every restart, whereas a delete is undone by the next\
        \ one."
      operationId: platform-access-rules-update
