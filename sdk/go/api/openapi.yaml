          description: Error
      security:
      - BearerAuth: []
      summary: Disable TOTP
      tags:
      - Auth
  /api/v1/auth/totp/setup:
    post:
      description: "REACHABLE BEFORE POLICY IS SATISFIED. A session that has authenticated\
        \ but not yet met a policy such as require_mfa can call this — that is the\
        \ point, since the endpoint exists to let someone comply. Authentication still\
        \ applies in full; only authorization is relaxed, and only for accounts holding\
        \ NO verified factor. An account that already has one must present it first,\
        \ or a stolen password could add its own authenticator. Generates a new TOTP\
        \ secret and returns the otpauth URI for QR code rendering."
      operationId: auth-totp-setup
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetupResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      summary: Start TOTP setup
      tags:
      - Auth
  /api/v1/auth/totp/verify:
    post:
      description: "REACHABLE BEFORE POLICY IS SATISFIED. A session that has authenticated\
        \ but not yet met a policy such as require_mfa can call this — that is the\
        \ point, since the endpoint exists to let someone comply. Authentication still\
        \ applies in full; only authorization is relaxed, and only for accounts holding\
        \ NO verified factor. An account that already has one must present it first,\
        \ or a stolen password could add its own authenticator. Confirms TOTP setup\
        \ by validating a code. This activates MFA for the user."
      operationId: auth-totp-confirm
      requestBody:
        content:
          application/json:
