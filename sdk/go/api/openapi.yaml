      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: "Reprioritise, disable, or re-scope a binding"
      tags:
      - Firewall
  /api/v1/firewall/hives/{hive_id}/publish:
    post:
      description: |-
        Renders every binding that applies to this fleet into one nft ruleset, stores it, and points the fleet at it. Bees converge on their next heartbeat.

        Publishing an UNCHANGED policy does nothing and says so. Every revision makes the whole fleet re-apply, and re-applying an identical ruleset flushes and reloads every host's firewall to arrive at the state it was already in.
      operationId: firewall-publish
      parameters:
      - explode: false
        in: path
        name: hive_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Publish this fleet's rules as the next revision
      tags:
      - Firewall
  /api/v1/firewall/hives/{hive_id}/revert:
    post:
      description: |-
        Publishes an OLD revision's body as a NEW revision. The number goes up, never down: a bee decides whether to converge by comparing what it applied against this number, and a number that moved backwards leaves a host pinned to the very ruleset being backed out.

        The old body verbatim, not a re-render of the old rules — the rules have moved on, which is why this is a backout.
      operationId: firewall-revert
      parameters:
      - explode: false
        in: path
        name: hive_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Republish an earlier revision's ruleset
      tags:
      - Firewall
  /api/v1/firewall/hives/{hive_id}/snapshots:
    get:
      description: "Newest first. This is what a backout is chosen from, so it carries\
