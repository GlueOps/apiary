      tags:
      - Platform
  /api/v1/platform/access-rules/{id}:
    delete:
      description: "Answers with a body rather than 204 because deleting a SEEDED\
        \ rule does not last: the next boot re-creates it as a create_org deny. The\
        \ response says so explicitly. Re-creating is fail-safe and stays that way\
        \ — being silent about it was the problem."
      operationId: platform-access-rules-delete
