  /api/v1/platform/policies/{kind}:
    delete:
      description: "Deleting is how the platform withdraws its opinion. That is NOT\
        \ the same as disabling: a disabled policy contributes nothing to the merge\
        \ either, but it is a stated position, and the distinction is what an organization\
        \ sees when deciding whether it needs its own."
