  /api/v1/ssh-keys:
    get:
      description: "Public halves and fingerprints. The private half is never returned\
        \ by any endpoint — it is unsealed only inside a River worker, so a fleet-wide\
        \ credential never passes through a response, a log or an error tracker."
      operationId: ssh-keys-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponseBody3"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: List fleet SSH keys
      tags:
      - Fleet
    post:
      description: "Creates an Ed25519 keypair. The private half is sealed with this\
        \ organization's own key and never leaves the control plane; the public half\
        \ is returned in authorized_keys form for whitelisting on hypervisors. Requires\
        \ admin and refuses impersonated sessions: this key opens root on every host\
        \ that trusts it, and an operator acting as a customer must not be able to\
        \ mint one they could later use."
      operationId: ssh-keys-mint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Mint a fleet SSH key
      tags:
      - Fleet
  /api/v1/ssh-keys/{id}:
    delete:
      description: "Marks the key unusable. It does NOT remove the public half from\
        \ any hypervisor — that happens when the agents next converge, so a revoked\
        \ key stays whitelisted on a host that is offline. The row is kept rather\
        \ than deleted, so a fingerprint found in an authorized_keys file later can\
        \ still be attributed to something."
      operationId: ssh-keys-revoke
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
