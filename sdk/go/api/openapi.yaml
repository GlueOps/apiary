            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      summary: Confirm TOTP setup
      tags:
      - Auth
  /api/v1/auth/verify-email:
    post:
      description: "Redeems the token from a confirmation link. This is what releases\
        \ provisioning of the organization's tenant database — registration deliberately\
        \ creates nothing but rows until an address is confirmed. No session is issued:\
        \ sign in through /auth/login afterwards."
