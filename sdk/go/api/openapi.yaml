openapi: 3.1.0
info:
  title: APIary
  version: dev
servers:
- description: API Server (local)
  url: http://127.0.0.1:8080
paths:
  /api/v1/admin/impersonate:
    post:
      description: "Platform staff only. The target must have enabled support access\
        \ or be covered by an active grant — the service refuses otherwise, and this\
        \ endpoint cannot override that. Returns an access token whose subject is\
        \ the target user and whose actor is the caller; every action taken with it\
        \ is attributed to both."
      operationId: admin-impersonate-start
      parameters:
      - explode: false
        in: header
        name: X-Real-Ip
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpersonateStartRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonateStartResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Begin impersonating a user
      tags:
      - Admin
  /api/v1/admin/impersonate/end:
    post:
      description: "Called BY the impersonated session, which is the only caller that\
        \ holds the JTI being revoked. It takes no parameters for that reason: everything\
        \ it needs — which session, which target, which actor — comes from the token,\
        \ so it cannot be pointed at somebody else's session."
      operationId: admin-impersonate-end
      parameters:
      - explode: false
        in: header
        name: X-Real-Ip
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpersonateEndRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonateEndResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: End the current impersonated session
      tags:
      - Admin
  /api/v1/agent/dist:
    get:
      description: |-
        A hypervisor in a managed estate has no route to the internet, so the control plane is the only host it can fetch a new agent from. Without this an upgrade means copying a binary to every machine by hand, which is how a fleet ends up running four different versions.

        An EMPTY build list is not a failure. A server compiled without agent binaries is an ordinary development build, and an agent reads it as nothing to do.
      operationId: fleet-bee-agent-dist
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDistResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - AgentKeyAuth: []
        AgentKeySecret: []
      summary: What agent binaries this control plane can serve
      tags:
      - Fleet
  /api/v1/agent/dist/{os}/{arch}:
    get:
      description: |-
        Authenticated, even though the same bytes sit in the SPA's embedded tree. Serving them as a static asset would hand the fleet's agent binary to anyone who could reach the login page.

        Verify the response against the sha256 from /agent/dist before running it.
      operationId: fleet-bee-agent-binary
      parameters:
      - explode: false
        in: path
        name: os
        required: true
        schema:
          maxLength: 16
          type: string
        style: simple
      - explode: false
        in: path
        name: arch
        required: true
        schema:
          maxLength: 16
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
          headers:
            Content-Disposition:
              explode: false
              schema:
                type: string
              style: simple
            Content-Type:
              explode: false
              schema:
                type: string
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - AgentKeyAuth: []
        AgentKeySecret: []
      summary: Download the agent binary for one platform
      tags:
      - Fleet
  /api/v1/agent/enrol:
    post:
      description: "Redeems an enrolment token and returns this host's agent-scoped\
        \ key and secret. The host is admitted into an ORGANIZATION, not a fleet —\
        \ joining one is a task, so a new host and a host migrating between fleets\
        \ follow the same path. Idempotent on machine_id: a rebuilt hypervisor re-enrols\
        \ onto the same MACHINE record with a fresh credential rather than leaving\
        \ a permanently-offline ghost. A machine a capacity sync has already discovered\
        \ in a cluster is adopted rather than duplicated, matched by the node name\
        \ its hostname implies."
      operationId: fleet-bee-enrol
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Enrol a fleet agent into an organization
      tags:
      - Fleet
  /api/v1/agent/firewall:
    get:
      description: |-
        The complete nft ruleset, not a patch — it begins with a flush, so a host that missed several revisions converges on this one rather than replaying a history it never saw.

        An EMPTY response means hold what you have. It is returned for a machine in no fleet and for a fleet that has published nothing, and neither is an empty ruleset: flushing there would strip a host of its management access at the moment it is least reachable. Separate from the heartbeat because the body can be tens of kilobytes and would otherwise ride on every poll from every host to say 'unchanged'.
      operationId: fleet-bee-firewall
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentFirewallResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - AgentKeyAuth: []
        AgentKeySecret: []
      summary: Fetch the ruleset this host should enforce
      tags:
      - Fleet
  /api/v1/agent/heartbeat:
    post:
      description: "One request carries both, deliberately: two endpoints would give\
        \ a bee two ways to be 'seen', and a bee parked on a long poll would have\
        \ to heartbeat separately to avoid looking dead. Declare unavailable_for_seconds\
        \ BEFORE doing anything that interrupts the host — a reboot is indistinguishable\
        \ from a failure unless the host says in advance that it is coming back."
      operationId: fleet-bee-heartbeat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - AgentKeyAuth: []
        AgentKeySecret: []
      summary: Report liveness and collect work
      tags:
      - Fleet
  /api/v1/agent/membership:
    get:
      description: |-
        The COMPLETE desired composition, not a delta. A node present in the cluster and absent from this list is desired-absent, which is what a departure looks like from the outside.

        Published per CLUSTER rather than per host, because a departure is executed by a node that REMAINS: the node being removed cannot run delnode against itself. An agent that only knew its own membership could never own that, so every member is told the whole composition and reconciles its own view of it.

        The agent derives the verb from this against what corosync reports — to become a member of a cluster with no other members is create, of one with members is join, and of nothing is delnode. Nothing here decides which.

        An EMPTY response means hold what you have. It is returned for a machine in no hive and for a hive that has published nothing, and neither is an instruction to leave a cluster.
      operationId: fleet-bee-membership
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMembershipResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - AgentKeyAuth: []
        AgentKeySecret: []
      summary: Fetch the cluster composition this host's hive should have
      tags:
      - Fleet
  /api/v1/agent/tasks/{id}/logs:
    post:
      description: "So a fleet operation can be watched without SSH-ing to a hypervisor\
        \ mid-rotation, which during an evacuation is often the one thing you must\
        \ not do. Lines carry a per-task sequence assigned by the bee; resending a\
        \ batch is a no-op."
      operationId: fleet-bee-append-logs
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogsRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - AgentKeyAuth: []
        AgentKeySecret: []
      summary: Stream task output back to the control plane
      tags:
      - Fleet
  /api/v1/agent/tasks/{id}/status:
    post:
      description: "Terminal reports are idempotent. A bee that finishes and dies\
        \ before its report is acknowledged will report again on restart, and rejecting\
        \ the duplicate would strand the task against a host that considers it done."
      operationId: fleet-bee-report-task
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - AgentKeyAuth: []
        AgentKeySecret: []
      summary: Report progress or the outcome of a task
      tags:
      - Fleet
  /api/v1/api-keys:
    get:
      description: "Your own user-scoped keys, plus the organization's org-scoped\
        \ keys. Never returns key or secret material: only hashes are stored, and\
        \ a key that is lost is replaced rather than recovered. Agent keys are not\
        \ listed — they belong to the fleet surface."
      operationId: api-keys-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIKeysResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: List API keys
      tags:
      - API Keys
    post:
      description: |-
        Returns the plaintext credential ONCE. Only its hash is stored, so a key that is not captured from this response is replaced rather than recovered — no endpoint reissues or reveals one.

        A user-scoped key needs nothing beyond membership: it acts as you and can do nothing you cannot. An org-scoped key is standing access to the whole tenant, so it requires admin and refuses impersonated sessions — an operator acting as a user must not be able to leave themselves a way back in. Agent-scoped keys are refused outright; they are issued only by fleet enrolment.
      operationId: api-keys-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintAPIKeyRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintAPIKeyResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Mint an API key
      tags:
      - API Keys
  /api/v1/api-keys/{id}:
    delete:
      description: "Revocation is permanent and takes effect on the next request the\
        \ key makes. You may revoke your own user-scoped keys. Revoking one of the\
        \ organization's org-scoped keys requires admin and refuses impersonated sessions,\
        \ for the same reason minting one does: it changes the tenant's standing access,\
        \ and that has to be attributable to a real admin. Nobody may revoke another\
        \ person's user key."
      operationId: api-keys-revoke
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAPIKeyResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Revoke an API key
      tags:
      - API Keys
  /api/v1/audit/events:
    get:
      description: |-
        Every action taken inside this organization's boundary, newest first: who took it, what it was done to, and whether it was allowed.

        REFUSALS ARE RECORDED TOO. Someone who tried to depart a node and was told no is a different fact from someone who never tried, and only one of them appears in the result of the action.

        The principal is not always a person. An organization API key authenticates a tenant rather than a human, and its actions are recorded against the key — so that 'automation did this' and 'nobody knows who did this' never look the same here.
      operationId: audit-events-list
      parameters:
      - description: "Exact action, e.g. hypervisor.cordon."
        explode: false
        in: query
        name: action
        required: false
        schema:
          description: "Exact action, e.g. hypervisor.cordon."
          type: string
        style: form
      - description: "hypervisor, hive, agent, firewall, estate or fleet."
        explode: false
        in: query
        name: target_kind
        required: false
        schema:
          description: "hypervisor, hive, agent, firewall, estate or fleet."
          type: string
        style: form
      - description: Narrow to one resource.
        explode: false
        in: query
        name: target_id
        required: false
        schema:
          description: Narrow to one resource.
          type: string
        style: form
      - description: Default 50.
        explode: false
        in: query
        name: limit
        required: false
        schema:
          description: Default 50.
          format: int64
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - explode: false
        in: query
        name: offset
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: "What has been done in this organization, and by whom"
      tags:
      - Fleet
  /api/v1/auth/forgot-password:
    post:
      description: Sends a password reset link if the address belongs to an active
        account. The response is identical either way.
      operationId: auth-forgot-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Request a password reset link
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: "Validates email and password, selects the user's organization,\
        \ and returns JWT access and refresh tokens."
      operationId: auth-login
      parameters:
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Authenticate a user
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes the current token session.
      operationId: auth-logout
      parameters:
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      summary: Logout current session
      tags:
      - Auth
  /api/v1/auth/mfa/verify:
    post:
      description: "Validates an MFA pending token and TOTP code, then returns full\
        \ access/refresh tokens."
      operationId: auth-mfa-verify
      parameters:
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAVerifyResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Complete MFA challenge
      tags:
      - Auth
  /api/v1/auth/passkey/login/begin:
    post:
      description: Starts the WebAuthn discoverable login flow. Returns options and
        a signed challenge.
      operationId: auth-passkey-login-begin
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyBeginLoginResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Begin passkey login
      tags:
      - Auth
  /api/v1/auth/passkey/login/finish:
    post:
      description: Validates the WebAuthn assertion and returns access/refresh tokens.
      operationId: auth-passkey-login-finish
      parameters:
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyFinishLoginRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyFinishLoginResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Complete passkey login
      tags:
      - Auth
  /api/v1/auth/passkey/register/begin:
    post:
      description: "REACHABLE BEFORE POLICY IS SATISFIED. A session that has authenticated\
        \ but not yet met a policy such as require_mfa can call this — that is the\
        \ point, since the endpoint exists to let someone comply. Authentication still\
        \ applies in full; only authorization is relaxed, and only for accounts holding\
        \ NO verified factor. An account that already has one must present it first,\
        \ or a stolen password could add its own authenticator. Starts the WebAuthn\
        \ registration flow. Returns creation options and a signed challenge."
      operationId: auth-passkey-register-begin
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyBeginRegisterResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      summary: Begin passkey registration
      tags:
      - Auth
  /api/v1/auth/passkey/register/finish:
    post:
      description: "REACHABLE BEFORE POLICY IS SATISFIED. A session that has authenticated\
        \ but not yet met a policy such as require_mfa can call this — that is the\
        \ point, since the endpoint exists to let someone comply. Authentication still\
        \ applies in full; only authorization is relaxed, and only for accounts holding\
        \ NO verified factor. An account that already has one must present it first,\
        \ or a stolen password could add its own authenticator. Validates the WebAuthn\
        \ attestation and stores the credential."
      operationId: auth-passkey-register-finish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyFinishRegisterRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyFinishRegisterResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      summary: Complete passkey registration
      tags:
      - Auth
  /api/v1/auth/passkeys:
    get:
      description: Returns all passkeys registered for the authenticated user.
      operationId: auth-passkeys-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyListResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      summary: List registered passkeys
      tags:
      - Auth
  /api/v1/auth/passkeys/{id}:
    delete:
      description: "Deletes a registered passkey. If no MFA methods remain, MFA is\
        \ disabled."
      operationId: auth-passkeys-delete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyDeleteResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      summary: Remove a passkey
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Validates a refresh token and returns a new access and refresh
        token pair.
      operationId: auth-refresh
      parameters:
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Refresh auth tokens
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      description: "Creates the user, an organization, and the owner membership binding\
        \ them — all in one transaction, because a user with no organization cannot\
        \ sign in at all. Returns NO tokens: the address must be confirmed first,\
        \ and confirming issues no session either — sign in through /auth/login afterwards.\
        \ The organization's tenant database is not provisioned until the address\
        \ is confirmed, so an unconfirmed signup costs a row and nothing else."
      operationId: auth-register
      parameters:
      - explode: false
        in: header
        name: X-Real-Ip
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: User-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an account and its first organization
      tags:
      - Auth
  /api/v1/auth/resend-verification:
    post:
      description: "Always answers 202, whatever the address. An unauthenticated endpoint\
        \ that answered differently for a registered address than an unregistered\
        \ one would be a membership oracle. Sending is throttled per account."
      operationId: auth-resend-verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequestBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendVerificationResponseBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a new confirmation link
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      description: "Consumes a single-use reset token, sets the new password, and\
