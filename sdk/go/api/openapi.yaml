  /api/v1/fleet/agent-upgrades:
    post:
      description: |-
        Queues one upgrade task per agent. Each host downloads the binary this control plane serves, verifies it against the advertised digest, proves it runs, keeps the previous one, and restarts.

        ROLLING BY CONSTRUCTION: a bee may hold at most one task, so no host does two things at once. Hosts do proceed in parallel with each other, which is safe here because an agent is not in the data path of anything it manages — an agent that fails to come back costs control of that host, not its guests.

        Agents already on the target version, offline, or holding another task are SKIPPED and each says why. Queueing an offline agent would hand it a task it collects whenever it returns, which is often during the next incident.
      operationId: fleet-agent-upgrade
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpgradeRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUpgradeResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Upgrade every agent in a fleet
      tags:
      - Fleet
  /api/v1/fleet/bees:
    get:
      operationId: fleet-bees-list
      parameters:
      - explode: false
        in: query
        name: hive_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBeesResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: List fleet agents
      tags:
      - Fleet
  /api/v1/fleet/bees/{id}:
    delete:
      description: |-
        Revokes this agent's credential and then deletes its record. The MACHINE survives as agentless — its cluster membership, address and onboarding history are on the hypervisor record, not on the agent — so this is 'remove the agent', never 'forget the box'.

        The credential is revoked FIRST and the revocation is verified before anything is deleted. It lives in the control database while the agent record lives in the tenant database, so no transaction covers both: deleting first and failing to revoke would leave a live agent key with nothing pointing at it, and nothing lists agent-scoped keys.

        Refused with 409 while an onboarding worker holds a lease on this machine — it is installing and enrolling right now, and would either race the delete or resurrect the record behind it.

        The agent process on the host is NOT stopped. It keeps running and starts failing authentication, which is the intended outcome: the credential is what this revokes.
      operationId: fleet-bees-delete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteBeeResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Remove a fleet agent
      tags:
      - Fleet
  /api/v1/fleet/enrolment-tokens:
    post:
      description: |-
        Admits a host into the ORGANIZATION, not into a cluster. Joining one is a task, so a brand-new host starts in the same fleetless state a migrating host passes through — which means an agent can be provisioned before any cluster exists.

        Impersonated sessions are refused: an operator acting as somebody else must not be able to mint something that admits a machine to the fleet.
      operationId: fleet-enrolment-tokens-mint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintTokenRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintTokenResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Mint an enrolment token
      tags:
      - Fleet
  /api/v1/fleet/fleetless:
    get:
      description: |-
        Machines with no hive: onboarded but not yet joined to a cluster, or departed from one. Every migration passes through this state and a failed arrival leaves a machine sitting in it.

        Each entry carries its onboarding state, because a machine that has not finished onboarding has no agent and an arrival pointed at it will fail at the SSH.
      operationId: fleet-hosts-fleetless
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFleetlessResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: List machines belonging to no hive
      tags:
      - Fleet
  /api/v1/fleet/fleetless/{hypervisor_id}/arrive:
    post:
      description: |-
        Records that this machine SHOULD be a member of that hive. Its own agent converges on it — no SSH, and nothing is dispatched.

        The agent derives what to do from the world rather than being told: to become a member of a cluster with no other members is create, of one that has members is join. Arrival and bootstrap are therefore the same request.

        Refused with 409 and reason codes when the host already belongs to a hive or still carries guests. The gate is here, on the WRITE of desired state, so a refusal is sticky: it never becomes desired state at all.
      operationId: fleet-hosts-arrive
      parameters:
      - explode: false
        in: path
        name: hypervisor_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArriveRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArriveResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Add a standalone machine to a hive
      tags:
      - Fleet
  /api/v1/fleet/fleetless/{hypervisor_id}/bootstrap:
    post:
      description: |-
        Makes this host the FIRST node of a cluster that has none.

        The counterpart of arrival, and the reason a new cluster can ever acquire a node: arrival refuses with target_hive_empty until a cluster has at least one member, which is every cluster on the day it is created.

        Not the same operation as arriving, despite looking like it. `pvecm create` replaces nothing and is safe on a host already running guests, while `pvecm add` replaces the joining node's cluster configuration and refuses a host carrying any guest at all — so this has no guest gate and arrival does.

        Refused with 409 and reason codes when the host already belongs to a cluster, when the target already has nodes (that is an arrival), or when the host has not finished onboarding.
      operationId: fleet-hosts-bootstrap
      parameters:
      - explode: false
        in: path
        name: hypervisor_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Create a cluster on a standalone machine
      tags:
      - Fleet
  /api/v1/fleet/hives:
    get:
      description: "Every hive in the caller's organization, with the node count and\
        \ whether a capacity sync can run for it. A hive with no API URL or credential\
        \ is never synced, so every node in it reads as never-observed and every departure\
        \ refuses."
      operationId: fleet-hives-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHivesResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: List hives
      tags:
      - Fleet
    post:
      operationId: fleet-hives-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHiveRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Create a hive
      tags:
      - Fleet
  /api/v1/fleet/hives/{id}:
    delete:
      description: |-
        Refuses while the cluster still holds hypervisors. A hypervisor row is the durable record of a physical machine — its machine id, its onboarding history, the agent bound to it — so deleting the cluster out from under one would either destroy that or leave it pointing at a cluster that no longer exists.

        Depart the nodes first; each one becomes fleetless and keeps its identity, and the cluster can then be removed.
      operationId: fleet-hives-delete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Delete a hive
      tags:
      - Fleet
    patch:
      description: Only the fields present are changed. Setting an API URL and a credential
        is what makes a hive syncable.
      operationId: fleet-hives-update
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHiveRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiveDetailView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Update a hive's configuration
      tags:
      - Fleet
  /api/v1/fleet/hives/{id}/sync:
    post:
      description: |-
        The same job the schedule runs, enqueued immediately. Most often wanted after a departure refused with drain_unknown, which means the last observation is too stale to say whether a node is empty.

        The job is unique per hive while queued or running, so asking twice gets the sync already on its way rather than a second one.
      operationId: fleet-hives-sync
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncHiveResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: Refresh a hive's capacity observations now
      tags:
      - Fleet
  /api/v1/fleet/hypervisors:
    get:
      description: |-
        Every MACHINE this organization owns, in a cluster or not. Each carries three independent statuses — provisioning_state (has the agent been installed), schedulable plus drain_state (may new work land here), and bee_status (is it answering right now) — because a machine can be provisioned AND cordoned AND offline at the same instant, and one badge cannot say that.

        When a node cannot leave its hive, the reasons why are computed by the same gate the departure job runs, so a client never has to reimplement it. A machine in no hive reports not_a_member and appears in /fleet/fleetless as well.
      operationId: fleet-hypervisors-list
      parameters:
      - description: Restrict to one hive.
        explode: false
        in: query
        name: hive_id
        required: false
        schema:
          description: Restrict to one hive.
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHypervisorsResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - OrgKeyAuth: []
        OrgKeySecret: []
      summary: List machines with their three status axes
      tags:
      - Fleet
    post:
      description: |-
        Records intent for one or more machines and queues them for onboarding. The ticker claims each on its next pass, connects over SSH with the fleet key, installs the agent and enrols it.

        THE HOST MUST ALREADY TRUST THE FLEET KEY. Install its public half in the host's authorized_keys first — Settings → Fleet SSH keys has the command — or every attempt fails as a refused connection.

        Addresses can be pasted as a list: one per line, or separated by commas or spaces, with blank lines and #-comments ignored. Each is reported on separately, because a rack declared all-or-nothing would roll back thirty-one good hosts over one repeat.
      operationId: fleet-hypervisors-declare
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareHostsRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclareHostsResponseBody"
          description: Created
        default:
