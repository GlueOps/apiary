# Pull-request gate.
#
# The generated-artifacts job is the other half of a deliberate change to
# .goreleaser.yaml: SDK generation used to run in goreleaser's before-hooks, where
# it rewrote tracked files and could fail the release on a dirty tree AFTER the
# tag was pushed — at which point the repo's version guards refuse to re-cut that
# version. Generation is now verified here, so drift fails a pull request, which
# is cheap and reversible, instead of a release, which is neither.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the version developers run locally. gen_random_uuid() is in
        # core from PG13 on, which the schemas rely on.
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apiary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d apiary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Every DB-backed test creates a schema private to the run and drops it in
      # TestMain (internal/testsupport). Nothing may write to public — the
      # isolation job below proves that rather than trusting it.
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/apiary_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Four modules live here (see go.work). Building only the root one would
      # silently stop covering the agent, the Proxmox client and the generated
      # SDK — each of which can break without the control plane noticing.
      #
      # GOWORK=off on purpose: the workspace resolves siblings from disk, which
      # hides a module whose own go.mod is incomplete. CI has to prove each one
      # builds the way a consumer would actually fetch it.
      - name: Build every module
        run: |
          set -euo pipefail
          for m in . ./pkg/proxmox ./sdk/go ./agent; do
            echo "::group::build $m"
            (cd "$m" && GOWORK=off go build ./...)
            echo "::endgroup::"
          done

      - name: Vet every module
        run: |
          set -euo pipefail
          for m in . ./pkg/proxmox ./sdk/go ./agent; do
            (cd "$m" && GOWORK=off go vet ./...)
          done

      # go.mod and go.sum must be self-consistent per module, or a consumer
      # fetching one on its own gets "missing go.sum entry".
      - name: Every module is tidy
        run: |
          set -euo pipefail
          for m in . ./pkg/proxmox ./sdk/go ./agent; do
            (cd "$m" && GOWORK=off go mod tidy)
          done
          if ! git diff --exit-code -- '**/go.mod' '**/go.sum' go.mod go.sum; then
            echo "::error::a module is not tidy; run go mod tidy in each and commit"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      - name: Test the agent
        run: cd agent && go test ./... -count=1

      # A suite that silently skipped its DB-backed tests looks exactly like one
      # that passed. Assert the database really was reachable.
      - name: Prove the database-backed tests actually ran
        run: |
          set -euo pipefail
          skipped=$(go test ./internal/service/ -count=1 -v 2>&1 | grep -c 'SKIPPING' || true)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped DB-backed test(s) skipped — TEST_DATABASE_URL is not reaching them."
            exit 1
          fi

      # Nothing may migrate or truncate tables in public. Doing so against a
      # developer's own DATABASE_URL destroys real data, which has happened here.
      - name: Prove schema isolation holds
        run: |
          set -euo pipefail
          export PGPASSWORD=test
          psql -h localhost -U test -d apiary_test -qc 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          go test ./... -count=1 >/dev/null
          tables=$(psql -h localhost -U test -d apiary_test -tAc \
            "select count(*) from information_schema.tables where table_schema='public';")
          leaked=$(psql -h localhost -U test -d apiary_test -tAc \
            "select count(*) from pg_namespace where nspname like 'apiary_%';")
          if [ "$tables" -ne 0 ]; then
            echo "::error::a test wrote $tables table(s) into public — it is not using testsupport.OpenSchema."
            psql -h localhost -U test -d apiary_test -tAc \
              "select table_name from information_schema.tables where table_schema='public';"
            exit 1
          fi
          if [ "$leaked" -ne 0 ]; then
            echo "::error::$leaked per-run schema(s) leaked — a package's TestMain is not dropping them."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v8 and an EXPLICIT version, not v6 with `latest`.
      #
      # golangci-lint refuses to run when the Go it was built with is older than
      # the `go` directive it is analysing, and this module targets 1.26.6. The v6
      # action resolves `latest` within the golangci-lint v1.x line, whose
      # releases are built with go1.24 — so every run failed on config load
      # without ever looking at the code. Pinned rather than floating so a new
      # upstream release cannot reintroduce the same mismatch silently.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      # golangci-lint analyses one module at a time; the root run does not
      # descend into the nested ones.
      - name: Lint the nested modules
        run: |
          set -euo pipefail
          for m in ./pkg/proxmox ./agent; do
            echo "::group::lint $m"
            (cd "$m" && golangci-lint run)
            echo "::endgroup::"
          done

  generated-artifacts:
    name: generated artifacts are committed and current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # openapi-generator-cli is a JVM tool behind an npm wrapper. This is the
      # dependency that made running generation at release time expensive, and the
      # reason it now lives here instead.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable corepack
        run: corepack enable

      - name: Install generator toolchain
        run: yarn install --immutable

      - name: Install UI dependencies
        run: yarn --cwd ui/ install --immutable

      - name: Regenerate
        run: go run . generate sdk

      - name: Tidy
        run: go mod tidy

      # The whole point: if regeneration moves anything, the committed SDK, the
      # OpenAPI document and the Terraform provider disagree with the handlers
      # that produced them. Failing here is a one-line fix on the branch.
      - name: Fail if anything changed
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::regenerating produced a diff. Run 'just sdk' and 'go mod tidy', then commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::regenerating produced untracked files:"
            git status --porcelain
            exit 1
          fi

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack
        run: corepack enable
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn test
      # Last, because it is the slowest and the others localise a failure better.
      - run: yarn build

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable corepack
        run: corepack enable
      - run: yarn install --immutable
      # --with-deps pulls the system libraries the browser needs; without it
      # chromium installs and then fails to launch with a missing-.so error that
      # reads like a Playwright bug.
      - run: yarn playwright install --with-deps chromium
      # Starts its own vite server (see playwright.config.ts) and asserts layout
      # invariants a unit test cannot see: that cards reach the width they ask
      # for, that no page scrolls sideways at desktop or phone width, and that
      # nothing logs a console error.
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
