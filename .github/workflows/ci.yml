# Pull-request gate.
#
# The generated-artifacts job is the other half of a deliberate change to
# .goreleaser.yaml: SDK generation used to run in goreleaser's before-hooks, where
# it rewrote tracked files and could fail the release on a dirty tree AFTER the
# tag was pushed — at which point the repo's version guards refuse to re-cut that
# version. Generation is now verified here, so drift fails a pull request, which
# is cheap and reversible, instead of a release, which is neither.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the version developers run locally. gen_random_uuid() is in
        # core from PG13 on, which the schemas rely on.
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apiary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d apiary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Every DB-backed test creates a schema private to the run and drops it in
      # TestMain (internal/testsupport). Nothing may write to public — the
      # isolation job below proves that rather than trusting it.
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/apiary_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Four modules live here (see go.work). Building only the root one would
      # silently stop covering the agent, the Proxmox client and the generated
      # SDK — each of which can break without the control plane noticing.
      #
      # GOWORK=off on purpose: the workspace resolves siblings from disk, which
      # hides a module whose own go.mod is incomplete. CI has to prove each one
      # builds the way a consumer would actually fetch it.
      - name: Build every module
        run: |
          set -euo pipefail
          for m in . ./pkg/proxmox ./sdk/go ./agent; do
            echo "::group::build $m"
            (cd "$m" && GOWORK=off go build ./...)
            echo "::endgroup::"
          done

      - name: Vet every module
        run: |
          set -euo pipefail
          for m in . ./pkg/proxmox ./sdk/go ./agent; do
            (cd "$m" && GOWORK=off go vet ./...)
          done

      # go.mod and go.sum must be self-consistent per module, or a consumer
      # fetching one on its own gets "missing go.sum entry".
      - name: Every module is tidy
        run: |
          set -euo pipefail
          for m in . ./pkg/proxmox ./sdk/go ./agent; do
            (cd "$m" && GOWORK=off go mod tidy)
          done
          if ! git diff --exit-code -- '**/go.mod' '**/go.sum' go.mod go.sum; then
            echo "::error::a module is not tidy; run go mod tidy in each and commit"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1

      - name: Test the agent
        run: cd agent && go test ./... -count=1

      # A suite that silently skipped its DB-backed tests looks exactly like one
      # that passed. Assert the database really was reachable.
      # Matches the TEST_DATABASE_URL skip specifically, not every 'SKIPPING'.
      #
      # This package also holds lab tests that require real Proxmox clusters
      # (APIARY_LAB_*) and a live Proxmox API. Those skip in CI by design and
      # always will, so counting every skip made the guard fire on the one thing
      # it was never meant to police — and a guard that cannot pass gets deleted
      # rather than fixed. What must never happen silently is a DB-backed test
      # skipping because the database is not reachable.
      - name: Prove the database-backed tests actually ran
        run: |
          set -euo pipefail
          skipped=$(go test ./internal/service/ -count=1 -v 2>&1 \
            | grep -c 'TEST_DATABASE_URL is not set' || true)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped DB-backed test(s) skipped — TEST_DATABASE_URL is not reaching them."
            exit 1
          fi

      # Nothing may migrate or truncate tables in public. Doing so against a
      # developer's own DATABASE_URL destroys real data, which has happened here.
      - name: Prove schema isolation holds
        run: |
          set -euo pipefail
          export PGPASSWORD=test
          psql -h localhost -U test -d apiary_test -qc 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          go test ./... -count=1 >/dev/null
          tables=$(psql -h localhost -U test -d apiary_test -tAc \
            "select count(*) from information_schema.tables where table_schema='public';")
          leaked=$(psql -h localhost -U test -d apiary_test -tAc \
            "select count(*) from pg_namespace where nspname like 'apiary_%';")
          if [ "$tables" -ne 0 ]; then
            echo "::error::a test wrote $tables table(s) into public — it is not using testsupport.OpenSchema."
            psql -h localhost -U test -d apiary_test -tAc \
              "select table_name from information_schema.tables where table_schema='public';"
            exit 1
          fi
          if [ "$leaked" -ne 0 ]; then
            echo "::error::$leaked per-run schema(s) leaked — a package's TestMain is not dropping them."
            exit 1
          fi

  secrets:
    name: no secrets in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history. The default shallow clone gives gitleaks one commit to
          # look at, so a credential added and then removed in a later commit —
          # which is the whole reason to scan history rather than the tree —
          # would not be there to find.
          fetch-depth: 0

      # The pinned binary, not gitleaks-action. That action requires a paid
      # licence for organization repositories and fails without GITLEAKS_LICENSE;
      # the scanner itself is MIT and has no such condition. Pinned to the same
      # version as mise.toml so a rule change upstream cannot turn this red on an
      # unrelated commit, and so `just secrets` and CI agree on what counts.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact so a real finding does not print the credential into a public
      # build log, which would leak it a second time on the way to reporting it.
      - name: Scan the history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  vulnerabilities:
    name: no known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # NOT pinned, and that is the opposite of the choice made for gitleaks two
      # jobs down — deliberately, because the two scanners fail in opposite
      # directions.
      #
      # A secret scanner whose rules move can turn a green history red on a
      # commit that changed nothing, so gitleaks is pinned. A vulnerability
      # scanner going red on a commit that changed nothing is the entire point:
      # it means an advisory was published against code this repository already
      # ships. Pinning the database away is the one thing that would make this
      # job worthless.
      #
      # The TOOL is still pinned. Only the vulnerability data it fetches from
      # vuln.go.dev is expected to move.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Every module, because govulncheck analyses one at a time and the root run
      # does not descend into the nested ones — the same reason the lint job
      # loops. GOWORK=off so each is resolved through its own go.mod rather than
      # the workspace, which is how they are built and released.
      #
      # This is reachability, not a manifest scan: govulncheck walks the call
      # graph and reports only advisories whose vulnerable symbols this code can
      # actually reach. An advisory sitting in a dependency nothing calls is not
      # a finding here, which is what makes a red result worth acting on.
      - name: Scan every module
        run: |
          set -euo pipefail
          failed=0
          for m in . ./pkg/proxmox ./sdk/go ./agent; do
            echo "::group::govulncheck $m"
            (cd "$m" && GOWORK=off govulncheck ./...) || failed=1
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::govulncheck reported a reachable vulnerability; see the groups above"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # v9 and an EXPLICIT version, not v6 with `latest`.
      #
      # golangci-lint refuses to run when the Go it was built with is older than
      # the `go` directive it is analysing, and this module targets 1.26.6. The v6
      # action resolves `latest` within the golangci-lint v1.x line, whose
      # releases are built with go1.24 — so every run failed on config load
      # without ever looking at the code. Pinned rather than floating so a new
      # upstream release cannot reintroduce the same mismatch silently.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
      # golangci-lint analyses one module at a time; the root run does not
      # descend into the nested ones.
      - name: Lint the nested modules
        run: |
          set -euo pipefail
          for m in ./pkg/proxmox ./agent; do
            echo "::group::lint $m"
            (cd "$m" && golangci-lint run)
            echo "::endgroup::"
          done

  generated-artifacts:
    name: generated artifacts are committed and current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'

      # openapi-generator-cli is a JVM tool behind an npm wrapper. This is the
      # dependency that made running generation at release time expensive, and the
      # reason it now lives here instead.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable corepack
        run: corepack enable

      - name: Install generator toolchain
        run: yarn install --immutable

      - name: Install UI dependencies
        run: yarn --cwd ui/ install --immutable

      - name: Regenerate
        run: go run . generate sdk

      - name: Tidy
        run: go mod tidy

      # The whole point: if regeneration moves anything, the committed SDK, the
      # OpenAPI document and the Terraform provider disagree with the handlers
      # that produced them. Failing here is a one-line fix on the branch.
      - name: Fail if anything changed
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::regenerating produced a diff. Run 'just sdk' and 'go mod tidy', then commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::regenerating produced untracked files:"
            git status --porcelain
            exit 1
          fi

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Enable corepack
        run: corepack enable
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn test
      # Last, because it is the slowest and the others localise a failure better.
      - run: yarn build

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Enable corepack
        run: corepack enable
      - run: yarn install --immutable
      # --with-deps pulls the system libraries the browser needs; without it
      # chromium installs and then fails to launch with a missing-.so error that
      # reads like a Playwright bug.
      - run: yarn playwright install --with-deps chromium
      # Starts its own vite server (see playwright.config.ts) and asserts layout
      # invariants a unit test cannot see: that cards reach the width they ask
      # for, that no page scrolls sideways at desktop or phone width, and that
      # nothing logs a console error.
      - run: yarn test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
