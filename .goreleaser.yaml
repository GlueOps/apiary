# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: apiary

before:
  hooks:
    # NOTHING HERE MAY WRITE A TRACKED FILE.
    #
    # goreleaser validates that the working tree is clean, and it does so AFTER
    # the tag has been pushed. A hook that rewrites a tracked file therefore
    # fails the release at the one moment it cannot be retried: the version
    # guards in this repo refuse to re-cut a tagged version, so recovering means
    # deleting a published release.
    #
    # `go run . generate sdk`, `go mod tidy` and `cd agent && go mod tidy` were
    # here and are gone for exactly that reason. Between them they rewrite
    # docs/openapi.json, ui/src/sdk, sdk/go, sdk/ts, terraform-provider-apiary,
    # go.mod, go.sum and agent/go.sum — every one of them tracked. It only ever
    # worked because the generators are version-pinned and reproduce
    # byte-identical output; the first time they did not, the release would fail
    # after the tag existed.
    #
    # Drift is caught on PULL REQUESTS instead, by the "generated artifacts are
    # committed and current" job in .github/workflows/ci.yml, which runs the same
    # generators and fails if anything moved. That is the same check, at the one
    # time it can still be fixed for free.
    #
    # What remains produces only GITIGNORED output, so it cannot dirty the tree:

    # The SPA. Its output (internal/api/webdist) is embedded at compile time, so
    # it has to exist before the server build runs.
    - yarn --cwd ui/ build

    # The agent, cross-compiled into internal/agentdist/dist so the SERVER can
    # serve it. A hypervisor in a managed estate has no route to the internet, so
    # the control plane is the only host it can fetch an upgrade from.
    #
    # A hook and not only the build entry below, because these bytes are EMBEDDED:
    # the server build reads the directory, so they have to exist first. The build
    # entry still produces the released artifacts; this is an earlier copy for
    # embedding.
    #
    # `just agent-dist` rather than an inline `go build`, so the flags live in one
    # place. An inline copy drifts, and the way it drifts is silent: `go build -X`
    # on a symbol that is not in the binary is not an error, so a stamp aimed at
    # the wrong path leaves every agent reporting "dev" with nothing to say why.
    #
    # ORDER-INDEPENDENT, which is the reason this output is not under
    # internal/api/webdist. The SPA build empties its own output directory
    # (emptyOutDir), so anything of ours living there has to be produced after it
    # — a correct release would then depend on the order of two lines in this
    # list, with nothing enforcing it and a silent empty catalogue when it is
    # wrong. Verified: running this hook before the SPA build leaves both binaries
    # intact.
    - just agent-dist

builds:
  - id: apiary
    main: ./main.go
    binary: apiary
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      # v{{ .Version }}, not {{ .Tag }}. .Tag is ALWAYS populated — on an untagged
      # commit it holds the most recent tag — so the old
      # `{{ if .Tag }}{{ .Tag }}{{ else }}dev{{ end }}` never reached its `dev`
      # branch, and a snapshot build reported itself as the last release. Since
      # `apiary version` is what you read off a running server to find out what is
      # deployed, that was a lie in the one place it matters. .Version resolves to
      # 1.2.3 on a tag and 1.2.4-SNAPSHOT-<commit> otherwise; the literal "v" keeps
      # the v-prefixed format this project releases under.
      - "-s -w -X github.com/glueops/apiary/internal/buildinfo.Version=v{{ .Version }} -X github.com/glueops/apiary/internal/buildinfo.Commit={{ .ShortCommit }} -X github.com/glueops/apiary/internal/buildinfo.Date={{ .Date }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  # The agent, built here rather than in a before-hook.
  #
  # A hook would work, but a build entry is what makes the agent a RELEASED
  # ARTIFACT: it gets the same GOOS/GOARCH matrix, the same reproducible
  # mod_timestamp, an archive, and a line in checksums.txt. An operator
  # onboarding a hypervisor by hand can then download exactly the binary the
  # control plane would have installed, and check it against the checksum.
  #
  # `dir` because the agent is its own module (github.com/glueops/apiary-agent).
  # It is separate so that an agent wanting to call a hypervisor does not have to
  # require the whole control plane — see go.work.
  - id: apiary-agent
    dir: agent
    main: .
    binary: apiary-agent
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    # main.*, not internal/buildinfo. The agent is a different module and stamps
    # its own package-level vars in agent/main.go, which it copies into
    # agent.Version. Pointing these at the control plane's buildinfo path would
    # be silently ignored — `go build -X` on a symbol that is not in the binary
    # is not an error — and every agent would report itself as "dev".
    ldflags:
      - "-s -w -X main.version=v{{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}"
    # Linux only. The agent is a systemd service that runs as root on a
    # hypervisor; there is no darwin host for it to run on.
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: apiary
    ids:
      - apiary
    formats:
      - tar.gz
    # The version is in the name on purpose: without it every release produces
    # apiary_linux_amd64.tar.gz, so two different builds land as byte-different
    # files with identical names in caches, mirrors and downloads folders.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

  - id: apiary-agent
    ids:
      - apiary-agent
    formats:
      - tar.gz
    name_template: >-
      apiary-agent_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

# ---- Container images -------------------------------------------------------
#
# The image is assembled from binaries goreleaser has ALREADY built, rather than
# compiled again inside a Dockerfile. That removes the second definition of how
# this project builds: the Dockerfile used to carry its own ldflags, and they had
# drifted — it stamped `main.version`, which does not exist in the control plane,
# so `go build -X` silently ignored it and every image reported itself as "dev"
# however carefully the build args were set. One place now decides flags,
# trimpath, mod_timestamp and the version stamp, for archives and images alike.
#
# It is also how multi-arch stops being expensive: each platform's binary is
# cross-compiled by Go on the runner's own architecture, so nothing is emulated
# under QEMU the way a multi-stage `docker buildx build` would be.
#
# dockers_v2, not dockers + docker_manifests. Those are deprecated as of
# goreleaser 2.18 and warn on every run; v2 also expresses this as ONE entry
# covering both platforms with the manifest implied, rather than two
# near-identical blocks and a third joining them by tag name — which is three
# places to keep a tag string in step.
dockers_v2:
  - id: apiary
    # BOTH binaries. The agent ships inside the control-plane image because the
    # onboarding job uploads it to a hypervisor over SSH — see the Dockerfile.
    ids:
      - apiary
      - apiary-agent
    dockerfile: Dockerfile
    images:
      - ghcr.io/glueops/apiary
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    # So `docker inspect` on a running image answers which commit it came from.
    # These and the version stamped into the binary come from the same template
    # and cannot disagree.
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "{{ .GitURL }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
